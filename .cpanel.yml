---
deployment:
  tasks:
    # DEPLOYPATH must match the "Repository Path" you set when creating the
    # repository in cPanel > Git Version Control (the domain's document root
    # points at DEPLOYPATH/public). The repo is already checked out here by
    # cPanel, so no copy/rsync step is needed — just install deps and cache.
    # Each task below is self-contained (cd + command) since tasks may run
    # in separate shells.
    - export DEPLOYPATH=/home/xwebbuil/mahadevachildrenhomeweb/
    - cd $DEPLOYPATH && $(command -v composer || echo /opt/cpanel/composer/bin/composer) install --no-dev --optimize-autoloader --no-interaction
    - cd $DEPLOYPATH && php artisan storage:link || true
    - cd $DEPLOYPATH && php artisan config:cache
    - cd $DEPLOYPATH && php artisan route:cache
    - cd $DEPLOYPATH && php artisan view:cache
    - cd $DEPLOYPATH && php artisan migrate --force
