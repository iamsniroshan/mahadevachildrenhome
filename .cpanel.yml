---
deployment:
  tasks:
    # DEPLOYPATH must match the "Repository Path" you set when creating the
    # repository in cPanel > Git Version Control. It should point at the
    # Laravel application root on the server (NOT public_html directly).
    - export DEPLOYPATH=/home/xwebbuil/mahadevachildrenhomeweb/
    - /bin/cp -R * $DEPLOYPATH
    - /bin/cp -R .cpanel.yml $DEPLOYPATH
    - cd $DEPLOYPATH
    - composer install --no-dev --optimize-autoloader --no-interaction
    - php artisan storage:link || true
    - php artisan config:cache
    - php artisan route:cache
    - php artisan view:cache
    - php artisan migrate --force
