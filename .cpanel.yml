---
deployment:
  tasks:
    # 1. Set this to your actual document root (cPanel "Domains" page shows it), e.g.
    #    /home/cpanelusername/public_html or /home/cpanelusername/public_html/yourdomain
    - export DEPLOYPATH=/home/cpanelusername/public_html/

    # 2. Sync repository files into the live document root (skips VCS metadata and
    #    local dev-only files so nothing overwrites your production .env).
    - /bin/cp -R --parents $(git diff-tree --no-commit-id --name-only -r HEAD | grep -v -E '^(\.env|\.cpanel\.yml)$') $DEPLOYPATH 2>/dev/null || /bin/rsync -a --exclude='.git' --exclude='.env' --exclude='node_modules' ./ $DEPLOYPATH

    # 3. Install PHP dependencies (production only, optimized autoloader).
    - /usr/local/bin/composer install --no-dev --optimize-autoloader --working-dir=$DEPLOYPATH

    # 4. Install & build frontend assets. Requires Node.js to be available on PATH
    #    (set up via cPanel's "Setup Node.js App" and export its bin dir first if needed).
    - cd $DEPLOYPATH && npm ci && npm run build

    # 5. Run database migrations non-interactively.
    - cd $DEPLOYPATH && php artisan migrate --force

    # 6. Refresh caches and the public storage symlink.
    - cd $DEPLOYPATH && php artisan config:cache
    - cd $DEPLOYPATH && php artisan route:cache
    - cd $DEPLOYPATH && php artisan view:cache
    - cd $DEPLOYPATH && php artisan storage:link || true
